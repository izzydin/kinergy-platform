# ==============================================================================
# Kinergy Platform - Unprivileged Nginx Reverse Proxy & Ingress Configuration
# Target: Alpine Nginx Unprivileged (UID 101) - Port 8080
# Contract:
#   - /api/*    -> NestJS API Upstream (http://api:3000)
#   - /healthz  -> Ingress Health Probe
#   - /assets/* -> Hashed Immutable Static Assets (1yr Cache)
#   - /*        -> SPA History Fallback (index.html, no-cache)
# ==============================================================================

# Map connection upgrades for HTTP/1.1 WebSocket & SSE streaming support
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security: Disable Nginx version emissions
    server_tokens off;

    # Request Body & Buffer Limits (10 MB payload limit for clinical/inventory batches)
    client_max_body_size 10m;
    client_body_buffer_size 128k;

    # Gzip Compression Optimization
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/x-javascript
        application/json
        application/xml
        application/javascript
        image/svg+xml;

    # Standard OWASP Defensive Security Headers for Static & SPA Responses
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-XSS-Protection "0" always;

    # --------------------------------------------------------------------------
    # 1. Ingress & Container Liveness / Readiness Health Check Endpoint
    # --------------------------------------------------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # --------------------------------------------------------------------------
    # 2. Public API Gateway Reverse Proxy Contract (/api/* -> NestJS Backend)
    #    Preserves full URL path, query params, verbs, headers, and authentication.
    # --------------------------------------------------------------------------
    location /api {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;

        # Upgrade / Streaming support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Standard Forwarded Host & Origin Invariants
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Production Timeout Governance
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;

        # Buffer Configuration
        proxy_buffering on;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;

        # Upstream Gateway Error Interception (Return structured JSON, NEVER SPA HTML)
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_gateway_error;
    }

    # Fallback JSON response when API backend is offline / restarting
    location @api_gateway_error {
        default_type application/json;
        return 502 '{"statusCode":502,"error":"Bad Gateway","message":"API gateway service temporarily unavailable"}';
    }

    # --------------------------------------------------------------------------
    # 3. Static Static Assets (Hashed, Long-Term Immutable Cache)
    # --------------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location = /favicon.ico {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
        log_not_found off;
    }

    # --------------------------------------------------------------------------
    # 4. SPA Client Routing (HTML5 History API Fallback)
    #    index.html MUST NEVER be cached so clients receive new version hashes.
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
