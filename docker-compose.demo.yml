# ==============================================================================
# Kinergy Platform - Dedicated MVP Demonstration Container Orchestration
# Architecture: 3-tier container stack (PostgreSQL 16, NestJS API, React/Nginx SPA)
# Usage:
#   Start stack:    docker compose -f docker-compose.demo.yml up -d
#   View logs:      docker compose -f docker-compose.demo.yml logs -f
#   Stop stack:     docker compose -f docker-compose.demo.yml down
#   Full reset:     docker compose -f docker-compose.demo.yml down -v
# ==============================================================================

services:
  demo-postgres:
    image: postgres:16-alpine
    container_name: kinergy-demo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kinergy_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kinergy_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-kinergy_dev}
    ports:
      - '${DEMO_POSTGRES_PORT:-5433}:5432'
    volumes:
      - demo_postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-kinergy_user} -d ${POSTGRES_DB:-kinergy_dev}']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - kinergy-demo-network

  demo-api:
    build:
      context: .
      dockerfile: infrastructure/deployment/docker/Dockerfile.api
    container_name: kinergy-demo-api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      API_PREFIX: api/v1
      DATABASE_URL: postgresql://${POSTGRES_USER:-kinergy_user}:${POSTGRES_PASSWORD:-kinergy_secure_pass}@demo-postgres:5432/${POSTGRES_DB:-kinergy_dev}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-kinergy-platform-dev-access-secret-min-32-chars!}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-kinergy-platform-dev-refresh-secret-min-32-chars!}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://localhost:4200
      CORS_ALLOW_CREDENTIALS: 'true'
      SWAGGER_ENABLED: 'true'
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_ROOT: /app/.storage
    ports:
      - '3000:3000'
    volumes:
      - demo_storage_data:/app/.storage
    depends_on:
      demo-postgres:
        condition: service_healthy
    networks:
      - kinergy-demo-network

  demo-web:
    build:
      context: .
      dockerfile: infrastructure/deployment/docker/Dockerfile.web
    container_name: kinergy-demo-web
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      - demo-api
    networks:
      - kinergy-demo-network

volumes:
  demo_postgres_data:
    name: kinergy_demo_postgres_data
  demo_storage_data:
    name: kinergy_demo_storage_data

networks:
  kinergy-demo-network:
    name: kinergy_demo_network
    driver: bridge
