version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kinergy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kinergy_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kinergy_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-kinergy_dev}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-kinergy_user} -d ${POSTGRES_DB:-kinergy_dev}']
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: kinergy-adminer
    restart: unless-stopped
    ports:
      - '${ADMINER_PORT:-8080}:8080'
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    name: kinergy_postgres_data
