name: CI Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: Validate Workspace
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kinergy_user
          POSTGRES_PASSWORD: kinergy_secure_pass
          POSTGRES_DB: kinergy_dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U kinergy_user -d kinergy_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      staging-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kinergy_staging_admin
          POSTGRES_PASSWORD: kinergy_staging_admin_password
          POSTGRES_DB: kinergy_staging
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U kinergy_staging_admin -d kinergy_staging"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://kinergy_user:kinergy_secure_pass@127.0.0.1:5433/kinergy_dev?schema=public
      STAGING_ADMIN_DATABASE_URL: postgresql://kinergy_staging_admin:kinergy_staging_admin_password@127.0.0.1:5434/kinergy_staging?schema=public
      STAGING_MIGRATOR_DATABASE_URL: postgresql://kinergy_migrator:kinergy_migrator_secure_password@127.0.0.1:5434/kinergy_staging?schema=public
      STAGING_DATABASE_URL: postgresql://kinergy_app:kinergy_app_secure_password@127.0.0.1:5434/kinergy_staging?schema=public
      STAGING_TEST_DATABASE_URL: postgresql://kinergy_test:kinergy_test_secure_password@127.0.0.1:5434/kinergy_staging?schema=public
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Prisma Migrations (Dev Database)
        run: pnpm prisma:migrate:deploy

      - name: Provision Staging Roles and Deploy Staging Migrations
        run: |
          PGPASSWORD=kinergy_staging_admin_password psql -h 127.0.0.1 -p 5434 -U kinergy_staging_admin -d kinergy_staging -f infrastructure/docker/init-staging-roles.sql
          DATABASE_URL="$STAGING_MIGRATOR_DATABASE_URL" pnpm prisma:migrate:deploy

      - name: Validate Workspace
        run: pnpm validate
